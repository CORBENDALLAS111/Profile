name: Build iOS IPA (unsigned)
on:
  push:
    branches:
      - 'doppel-ios'
    paths:
      - 'DoppelNative/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Compile native app
        run: |
          set -o pipefail
          xcodebuild -project DoppelNative.xcodeproj \
            -scheme DoppelNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Assemble unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p staging/Payload
          cp -R build/Build/Products/Release-iphoneos/DoppelNative.app staging/Payload/
          cd staging
          zip -qry ../DoppelNative-unsigned.ipa Payload
          cd ..
          shasum -a 256 DoppelNative-unsigned.ipa > DoppelNative-unsigned.ipa.sha256
          ls -lh DoppelNative-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DoppelNative-unsigned-IPA
          path: |
            DoppelNative-unsigned.ipa
            DoppelNative-unsigned.ipa.sha256
          retention-days: 30
